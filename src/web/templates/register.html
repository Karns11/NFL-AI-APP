<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Fantasy AI — Create Account</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
    h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; letter-spacing: 0.4px; text-transform: uppercase; }
    .hint { font-size: 11px; color: #475569; margin-top: -14px; margin-bottom: 18px; }
    input { width: 100%; padding: 10px 12px; background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; color: #f1f5f9; font-size: 14px; margin-bottom: 18px; outline: none; }
    input:focus { border-color: #3b82f6; }
    .btn { width: 100%; padding: 11px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2563eb; }
    .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
    .footer a { color: #3b82f6; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .flash { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; }
    .flash-error   { background: #450a0a; color: #f87171; }
    .flash-success { background: #14532d; color: #4ade80; }
  </style>
</head>
<body>
<div class="card">
  <h1>Create Account</h1>
  <div class="subtitle">NFL Fantasy AI · Free to join</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <label for="display_name">Your Name</label>
    <input type="text" id="display_name" name="display_name" placeholder="e.g. Nathan" autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required placeholder="Min 8 characters">
    <div class="hint">At least 8 characters</div>

    <button type="submit" class="btn">Create Account</button>
  </form>

  <div class="footer">
    Already have an account? <a href="{{ url_for('main.login') }}">Sign in</a>
  </div>
</div>
</body>
</html>
